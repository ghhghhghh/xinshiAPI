[package]
name = "rustone"
version = "0.1.0"
description = "信使 API 工作台"
authors = ["you"]
edition = "2024"
default-run = "rustone"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rustone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "gzip", "brotli", "deflate", "stream", "http2"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.28.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
base64 = "0.23.1"
tokio-util = { version = "0.7.20", features = ["rt"] }
futures-util = "0.3.34"
tauri-plugin-window-state = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
